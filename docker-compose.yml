# Local infrastructure for the "local" profile.
# order-service refuses to start when the Kafka broker is down.
name: market-platform

services:
  postgres:
    image: postgres:16-alpine
    container_name: market-postgres
    environment:
      POSTGRES_DB: market
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: market-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  kafka:
    # Tag matches kafka-clients managed by Spring Boot 3.5.16 (3.9.2). KRaft, no ZooKeeper.
    # The image defaults advertise localhost:9092, which is what the app on the host uses.
    image: apache/kafka:3.9.2
    container_name: market-kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 18
      start_period: 20s

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.2.1
    container_name: market-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
