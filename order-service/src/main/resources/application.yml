spring:
  application:
    name: order-service
  cache:
    type: redis
    redis:
      time-to-live: 5m
      cache-null-values: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    admin:
      # KafkaAdmin applies fail-fast only when it creates topics.
      # KafkaHealthIndicator always describes the cluster and stops startup if the broker is down.
      # Compose supplies Kafka for local; tests use Testcontainers. There is no in-memory stand-in.
      fail-fast: true
      operation-timeout: 15s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,kafka
  health:
    kafka:
      enabled: true
    redis:
      enabled: true
    db:
      enabled: true

info:
  app:
    description: Event-driven order platform. Order lifecycle is published to Kafka.
