spring:
  application:
    name: order-service
  cache:
    type: redis
    redis:
      time-to-live: 5m
      cache-null-values: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    admin:
      # KafkaAdmin applies fail-fast only when it creates topics.
      # KafkaHealthIndicator always describes the cluster and stops startup if the broker is down.
      # Compose supplies Kafka for local; tests use Testcontainers. There is no in-memory stand-in.
      fail-fast: true
      operation-timeout: 15s

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis,kafka
  health:
    kafka:
      enabled: true
    redis:
      enabled: true
    db:
      enabled: true

info:
  app:
    description: Event-driven order platform. Order lifecycle is published to Kafka.

market:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
  cart:
    redis-key-prefix: cart
    ttl: 7d
  order:
    idempotency-ttl: 24h
  outbox:
    poll-delay-ms: 1000
    batch-size: 20
  security:
    jwt:
      issuer: market-platform
      secret: ${JWT_SECRET:change-me-local-demo-secret-min-32-chars!!}
    demo-token:
      enabled: true
      access-token-ttl: 1h
    rate-limit:
      create-order-limit: 30
      create-order-window: 1m