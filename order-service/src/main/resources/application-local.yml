# Defaults match docker-compose.yml and .env.example.
# Startup exits when the broker at KAFKA_BOOTSTRAP_SERVERS cannot be reached.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/market}
    username: ${DB_USERNAME:market}
    password: ${DB_PASSWORD:market}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

market:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-local-demo-secret-min-32-chars!!}
